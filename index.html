<title>Sasimumm OÜ</title>

<style>
:root { --s: min(90vw, 70vh, max(720px, 45vw)); }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background:
  radial-gradient(ellipse 60% 50% at 0% 0% in oklab, rgba(255,222,170,.5), transparent 70%),
  radial-gradient(ellipse 70% 60% at 100% 0% in oklab, rgba(160,205,245,.8), transparent 70%),
  radial-gradient(ellipse 60% 50% at 100% 80% in oklab, rgba(255,200,215,.45), transparent 70%),
  linear-gradient(in oklab, #d6ecfa, #fffdf6 75%); }
body { display: flex; flex-direction: column; }
/* equal gaps top/text/bee/ground; the text-bee and bee-ground gaps are capped at ~60% of the bee's height, extra space goes to the top */
:root { --gap: min(calc(var(--s) * .3), calc((78vh - var(--s) * .66) / 3)); }
main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: var(--gap); padding-bottom: calc(var(--s) * .06 + var(--gap)); }
svg { overflow: visible; }
.text { width: calc(var(--s) * .575); }
.bee-svg { width: calc(var(--s) * .45); }
.ground { position: relative; height: 22vh; background: linear-gradient(rgb(126,176,86), rgb(104,150,72)); }
.grass-svg { position: absolute; left: 0; bottom: 100%; width: 100%; height: calc(var(--s) * 30 / 414); }
.bee { animation: hover 2.4s ease-in-out infinite; }
.shadow { transform-box: fill-box; transform-origin: center; animation: shade 2.4s ease-in-out infinite; }
.wing { transform-box: fill-box; transform-origin: 50% 100%; animation: flap .3s ease-in-out infinite alternate; }
.wing.back { animation-direction: alternate-reverse; }
.grass { animation: scroll 1.6s linear infinite; }
@keyframes hover { 50% { transform: translateY(-14px); } }
@keyframes shade { 50% { transform: scale(.8); opacity: .6; } }
@keyframes scroll { from { transform: translateX(-138px); } to { transform: translateX(0); } }
@keyframes flap { from { transform: rotate(-18deg); } to { transform: rotate(18deg); } }
@media (prefers-reduced-motion: reduce) { .bee, .shadow, .wing, .grass { animation: none; } }
</style>
